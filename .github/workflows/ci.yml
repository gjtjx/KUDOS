name: ClinicPilot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m coverage run -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
          AI_MODE: local
      - run: python -m coverage report
      - run: python scripts/validate_deployment.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run test:coverage && npm run build
        working-directory: frontend
  container:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLINIC_PORT: '8001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: docker compose -p clinicpilot-ci up --build -d --wait --wait-timeout 120
      - run: python scripts/smoke_deployment.py --write-booking
      - run: docker compose -p clinicpilot-ci restart
      - run: docker compose -p clinicpilot-ci up -d --wait --wait-timeout 120
      - run: python scripts/smoke_deployment.py --verify-report runtime/deployment-smoke.json
      - if: always()
        run: docker compose -p clinicpilot-ci down --volumes
