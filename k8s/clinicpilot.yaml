apiVersion: v1
kind: Namespace
metadata:
  name: clinicpilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinicpilot-config
  namespace: clinicpilot
data:
  AI_MODE: local
  DATABASE_PATH: /app/runtime/clinic.db
  TRACE_ENABLED: "true"
  TRACE_MAX_RECORDS: "1000"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clinicpilot-data
  namespace: clinicpilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicpilot
  namespace: clinicpilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clinicpilot
  template:
    metadata:
      labels:
        app: clinicpilot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 210
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clinicpilot
          image: clinicpilot:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: clinicpilot-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /app/runtime
            - name: tmp
              mountPath: /tmp
            - name: llm-key
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clinicpilot-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: llm-key
          secret:
            secretName: clinicpilot-llm
            optional: true
            defaultMode: 0440
            items:
              - key: LLM_API_KEY
                path: llm_api_key
---
apiVersion: v1
kind: Service
metadata:
  name: clinicpilot
  namespace: clinicpilot
spec:
  type: ClusterIP
  selector:
    app: clinicpilot
  ports:
    - name: http
      port: 8000
      targetPort: http
